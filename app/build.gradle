plugins { id 'com.android.application' }

android {
    namespace 'com.folio.reader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.folio.reader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Personal sideload build: retain the original local certificate for in-place updates.
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug; debuggable false } }
    testOptions { unitTests.includeAndroidResources = true }
    packaging {
        jniLibs.useLegacyPackaging = true
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'
}
