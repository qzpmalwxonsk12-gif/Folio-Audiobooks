<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=3,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>Folio · A little more reading time</title>
  <link rel="stylesheet" href="app.css">
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#library" aria-label="Folio library"><span class="brand-mark">f<span>⋮</span></span><span>folio<span class="brand-dot">.</span></span></a>
      <div class="side-caption">A LITTLE MORE READING TIME</div>
      <nav class="desktop-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-note"><div class="little-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p>A good book.<br>A voice of its own.</p><small>YOUR PERSONAL LISTENING SPACE</small></div>
      <div class="private-label"><span data-icon="shield"></span> Your library stays on this device</div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <a class="mobile-brand brand" href="#library"><span class="brand-mark">f<span>⋮</span></span><span>folio<span class="brand-dot">.</span></span></a>
        <div class="breadcrumb">YOUR PERSONAL LISTENING SPACE</div>
        <button class="icon-button theme-toggle" data-action="theme" aria-label="Switch color theme" title="Switch color theme"><span data-icon="moon"></span></button>
      </header>
      <main id="main" tabindex="-1">
        <section id="library" class="view active" aria-labelledby="library-title"></section>
        <section id="player" class="view" aria-labelledby="player-title"></section>
        <section id="stats" class="view" aria-labelledby="stats-title"></section>
        <section id="settings" class="view" aria-labelledby="settings-title"></section>
      </main>
    </div>
    <div id="mini-player" class="mini-player hidden"></div>
    <nav class="mobile-nav" aria-label="Main navigation"></nav>
  </div>
  <div id="import-progress" class="import-progress hidden" role="status" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div class="sheet-header"><h2 id="sheet-title"></h2><button class="icon-button" data-action="close" aria-label="Close dialog"><span data-icon="close"></span></button></div><div id="sheet-body"></div></dialog>
</body>
</html>
